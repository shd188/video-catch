<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>激活软件 — 小鹅通课程下载器</title>
  <link rel="stylesheet" href="/course-dl/styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>激活软件</h1>
      <p>在软件里复制本机机器码，再填写小红书订单号提交。订单号、机器码和激活码会写入数据库。</p>
    </header>
    <nav>
      <a href="/course-dl/">首页</a>
      <a class="active" href="/course-dl/activate.html">激活软件</a>
      <a href="/course-dl/guide.html">使用教程</a>
    </nav>

    <div class="card">
      <form id="form">
        <label for="order">小红书订单号</label>
        <input
          id="order"
          class="mono"
          placeholder="P802096514294231571"
          autocomplete="off"
          required
          maxlength="19"
          minlength="19"
          pattern="P[0-9]{18}"
          inputmode="text"
          spellcheck="false"
        />
        <p class="hint" id="order-hint">须以 <strong>P</strong> 开头，后面 <strong>18 位数字</strong>，共 19 位。每个订单号只能激活一次。</p>

        <label for="device">本机机器码（在软件窗口复制）</label>
        <input
          id="device"
          class="mono"
          placeholder="XXXX-XXXX-XXXX-XXXX"
          autocomplete="off"
          required
          spellcheck="false"
        />
        <p class="hint">打开软件即可看到机器码。激活完成后，把下面显示的激活码粘贴回软件即可。</p>

        <div class="row" style="margin-top:18px">
          <button class="btn" type="submit" id="submit">提交激活</button>
        </div>
      </form>
      <div class="msg" id="msg"></div>
      <div class="reveal" id="reveal">
        <h3>你的激活码</h3>
        <div class="code-box">
          <strong id="code-out"></strong>
          <button class="btn secondary" type="button" id="copy">复制</button>
        </div>
        <p class="hint">请回到软件，把激活码粘贴进去完成验证。订单号无需再填。</p>
      </div>
    </div>
  </div>
  <script>
    const msg = document.getElementById("msg");
    const reveal = document.getElementById("reveal");
    const codeOut = document.getElementById("code-out");

    function show(text, ok) {
      msg.textContent = text;
      msg.className = "msg show " + (ok ? "ok" : "err");
    }

    const ORDER_RE = /^P\d{18}$/;
    const ORDER_LEN = 19;
    const orderInput = document.getElementById("order");
    const orderHint = document.getElementById("order-hint");
    const deviceInput = document.getElementById("device");

    function normalizeOrder(raw) {
      return String(raw || "")
        .trim()
        .replace(/\s+/g, "")
        .toUpperCase();
    }

    function normalizeDevice(raw) {
      return String(raw || "")
        .trim()
        .toUpperCase()
        .replace(/[^A-Z0-9-]/g, "");
    }

    function orderError(value) {
      if (!value) return "请填写小红书订单号";
      if (value[0] !== "P") return "订单号必须以 P 开头";
      if (/[^P0-9]/.test(value)) return "订单号只能是 P 加数字，不能有空格或其它字符";
      if (value.length !== ORDER_LEN) {
        return "订单号须为 19 位（P + 18 位数字），当前 " + value.length + " 位";
      }
      if (!ORDER_RE.test(value)) return "格式不对，须为 P 加 18 位数字，例如 P802096514294231571";
      return "";
    }

    orderInput.addEventListener("input", () => {
      let v = orderInput.value.toUpperCase().replace(/[^P0-9]/g, "");
      if (v.length > ORDER_LEN) v = v.slice(0, ORDER_LEN);
      if (orderInput.value !== v) orderInput.value = v;
      const err = orderError(v);
      if (v && err) {
        orderHint.textContent = err;
        orderHint.style.color = "var(--bad)";
      } else {
        orderHint.innerHTML =
          "须以 <strong>P</strong> 开头，后面 <strong>18 位数字</strong>，共 19 位。每个订单号只能激活一次。";
        orderHint.style.color = "";
      }
    });

    deviceInput.addEventListener("input", () => {
      const v = normalizeDevice(deviceInput.value);
      if (deviceInput.value !== v) deviceInput.value = v;
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const order = normalizeOrder(orderInput.value);
      const deviceId = normalizeDevice(deviceInput.value);
      orderInput.value = order;
      deviceInput.value = deviceId;
      const err = orderError(order);
      if (err) {
        show(err, false);
        reveal.classList.remove("show");
        return;
      }
      if (!deviceId || deviceId.replace(/-/g, "").length < 8) {
        show("请填写软件里显示的本机机器码", false);
        reveal.classList.remove("show");
        return;
      }
      const btn = document.getElementById("submit");
      btn.disabled = true;
      reveal.classList.remove("show");
      try {
        const r = await fetch("/api/web-activate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ order_no: order, device_id: deviceId }),
        });
        const d = await r.json();
        const code = d.license_key || d.code;
        if (d.ok && code) {
          codeOut.textContent = code;
          reveal.classList.add("show");
          show(d.message || "激活成功，记录已写入数据库。请把激活码粘贴回软件。", true);
        } else {
          show(d.error || d.message || "激活失败", false);
        }
      } catch (err) {
        show("网络错误：" + err, false);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("copy").addEventListener("click", async () => {
      const text = codeOut.textContent || "";
      try {
        await navigator.clipboard.writeText(text);
        show("已复制激活码", true);
      } catch {
        show("复制失败，请手动选中激活码", false);
      }
    });
  </script>
</body>
</html>
